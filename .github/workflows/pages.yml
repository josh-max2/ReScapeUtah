# Build the game and publish it to GitHub Pages.
#
# base is derived from the REPOSITORY NAME at build time, not hardcoded: a
# project page is served from /<repo>/, and every map, texture and font path
# is resolved against it (see asset() in src/defs.ts). Hardcoding it means the
# page loads and the field is empty the moment the repo is renamed or forked.
name: pages

on:
  push:
    branches: [swarm]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          SWARM_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
