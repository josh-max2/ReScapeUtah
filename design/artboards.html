<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SWARM — art direction boards</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0c0c0e;font-family:'Bahnschrift','Arial Narrow',sans-serif;padding:20px 0 60px}
  .wrap{width:1200px;margin:0 auto 40px}
  canvas{display:block;width:1200px;height:760px;border-radius:4px}
  h2{color:#ddd;font-size:13px;letter-spacing:.28em;margin:0 0 8px 2px}
  h2 span{color:#777;font-size:10px;letter-spacing:.14em;margin-left:10px}
</style></head><body>

<div class="wrap"><h2>A · STORYBOOK BASTION<span>hand-painted cartoon · Kingdom Rush lineage</span></h2><canvas id="a" width="1200" height="760"></canvas></div>
<div class="wrap"><h2>B · GRIT &amp; STEEL<span>industrial hard-surface · material contrast</span></h2><canvas id="b" width="1200" height="760"></canvas></div>
<div class="wrap"><h2>C · TOY BOX<span>glossy rendered-3D look · BTD6 lineage</span></h2><canvas id="c" width="1200" height="760"></canvas></div>
<div class="wrap"><h2>D · INK &amp; WASH<span>paper, ink linework, watercolour</span></h2><canvas id="d" width="1200" height="760"></canvas></div>
<div class="wrap"><h2>E · NEON PRECINCT<span>wet-asphalt noir · volumetric light</span></h2><canvas id="e" width="1200" height="760"></canvas></div>

<script>
// ============ shared craft helpers ============
const LX = -0.55, LY = -0.83; // light direction (upper-left)

function shadeBall(ctx, x, y, r, dark, light) {
  const g = ctx.createRadialGradient(x + LX * r * .45, y + LY * r * .45, r * .12, x, y, r);
  g.addColorStop(0, light); g.addColorStop(1, dark);
  ctx.fillStyle = g;
}
function drop(ctx, x, y, rx, ry, a = .32) {
  ctx.fillStyle = `rgba(0,0,0,${a})`;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill();
}
function ink(ctx, w, col = 'rgba(24,18,14,.85)') { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; }
function grain(ctx, x, y, w, h, n, lo, hi) {
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = Math.random() < .5 ? lo : hi;
    ctx.fillRect(x + Math.random() * w, y + Math.random() * h, 1 + Math.random() * 2.5, 1 + Math.random() * 2);
  }
}
function tree(ctx, x, y, s, dark, mid, lite) {
  drop(ctx, x + s * .3, y + s * .5, s * .95, s * .38, .28);
  ctx.fillStyle = '#3b2b1c';
  ctx.fillRect(x - s * .1, y - s * .1, s * .2, s * .55);
  for (const [ox, oy, rr, c] of [[-.45,-.15,.55,dark],[.45,-.1,.5,dark],[0,-.5,.6,mid],[-.2,-.3,.45,mid],[.22,-.42,.4,lite]]) {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(x + ox * s, y + oy * s, rr * s, 0, 7); ctx.fill();
  }
}
function rock(ctx, x, y, s, faces) {
  drop(ctx, x + s * .25, y + s * .42, s * .95, s * .34, .3);
  faces.forEach(f => {
    ctx.fillStyle = f.c; ctx.beginPath();
    f.p.forEach((p, i) => i ? ctx.lineTo(x + p[0] * s, y + p[1] * s) : ctx.moveTo(x + p[0] * s, y + p[1] * s));
    ctx.closePath(); ctx.fill();
  });
}
function label(ctx, x, y, t, col = '#fff', sz = 11) {
  ctx.font = `700 ${sz}px Bahnschrift`; ctx.fillStyle = col; ctx.fillText(t, x, y);
}
function assetBar(ctx, y, bg, line) {
  ctx.fillStyle = bg; ctx.fillRect(0, y, 1200, 760 - y);
  ctx.fillStyle = line; ctx.fillRect(0, y, 1200, 2);
}

// ============ A · STORYBOOK BASTION ============
(() => {
  const ctx = document.getElementById('a').getContext('2d');
  // rolling meadow with painted bands
  const g = ctx.createLinearGradient(0, 0, 300, 560);
  g.addColorStop(0, '#7fa63f'); g.addColorStop(1, '#5c8330');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1200, 560);
  for (let i = 0; i < 26; i++) { // meadow tone patches
    ctx.fillStyle = ['rgba(150,190,90,.20)','rgba(60,90,36,.18)','rgba(190,205,110,.12)'][i % 3];
    ctx.beginPath(); ctx.ellipse(Math.random()*1200, Math.random()*540, 60+Math.random()*130, 26+Math.random()*54, Math.random()*3, 0, 7); ctx.fill();
  }
  for (let i = 0; i < 900; i++) { // grass tufts
    const x = Math.random()*1200, y = Math.random()*550;
    ctx.strokeStyle = Math.random()<.5 ? 'rgba(40,66,24,.5)' : 'rgba(170,200,105,.45)';
    ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (Math.random()-.5)*4, y - 3 - Math.random()*4); ctx.stroke();
  }
  // dirt road, painted with rutted edges
  const road = [[-20,120],[190,150],[380,215],[560,255],[720,300],[860,368],[980,440],[1090,470]];
  ink(ctx, 76, '#4d3520'); ctx.beginPath(); road.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]+5):ctx.moveTo(p[0],p[1]+5)); ctx.stroke();
  ink(ctx, 66, '#8c6b42'); ctx.beginPath(); road.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
  ink(ctx, 40, '#a2814f'); ctx.beginPath(); road.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]-2):ctx.moveTo(p[0],p[1]-2)); ctx.stroke();
  for (let i = 0; i < 380; i++) { // gravel + wheel ruts
    const t = Math.random(), seg = Math.min(road.length-2, (t*(road.length-1))|0), f = t*(road.length-1)-seg;
    const rx = road[seg][0]+(road[seg+1][0]-road[seg][0])*f, ry = road[seg][1]+(road[seg+1][1]-road[seg][1])*f;
    ctx.fillStyle = Math.random()<.5 ? 'rgba(70,48,28,.35)' : 'rgba(215,190,140,.3)';
    ctx.beginPath(); ctx.arc(rx+(Math.random()-.5)*54, ry+(Math.random()-.5)*44, .8+Math.random()*2.2, 0, 7); ctx.fill();
  }
  // treeline + props
  [[80,470,42],[170,520,34],[36,330,30],[1090,120,44],[1010,200,32],[1150,265,28],[620,90,38],[740,140,30],[430,470,36],[540,540,30],[300,395,26]]
    .forEach(([x,y,s]) => tree(ctx, x, y, s, '#2c4a1c', '#3f6b26', '#5b8f33'));
  [[250,300,26],[905,215,22],[690,470,30],[1140,400,24]].forEach(([x,y,s]) =>
    rock(ctx, x, y, s, [{c:'#6b6558',p:[[-1,.3],[-.6,-.7],[.5,-.9],[1,.1],[.4,.7],[-.5,.75]]},
                        {c:'#8e8878',p:[[-.6,-.7],[.5,-.9],[.2,-.1],[-.5,.05]]},
                        {c:'#57513f',p:[[-.5,.05],[.2,-.1],[1,.1],[.4,.7],[-.5,.75]]}]));
  // fortified gatehouse (defender objective) bottom-right
  (() => {
    const bx = 1075, by = 462;
    drop(ctx, bx+8, by+58, 110, 34, .35);
    ctx.fillStyle = '#6d6154'; ctx.beginPath(); ctx.roundRect(bx-96, by-52, 192, 108, 8); ctx.fill();
    ctx.fillStyle = '#87796a'; ctx.beginPath(); ctx.roundRect(bx-96, by-52, 192, 42, 8); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    for (let r = 0; r < 4; r++) for (let c = 0; c < 8; c++)
      ctx.fillRect(bx-92+c*24+((r%2)*12), by-46+r*26, 20, 3);
    for (let m = 0; m < 5; m++) { ctx.fillStyle = '#7d7062'; ctx.fillRect(bx-96+m*42, by-70, 26, 20); }
    ctx.fillStyle = '#2b2018'; ctx.beginPath(); ctx.roundRect(bx-26, by-6, 52, 62, 6); ctx.fill();
    ink(ctx, 3.5); ctx.beginPath(); ctx.roundRect(bx-96, by-52, 192, 108, 8); ctx.stroke();
    // banner
    ctx.fillStyle = '#b8402f'; ctx.beginPath(); ctx.moveTo(bx+52,by-70); ctx.lineTo(bx+80,by-70); ctx.lineTo(bx+80,by-22); ctx.lineTo(bx+66,by-32); ctx.lineTo(bx+52,by-22); ctx.closePath(); ctx.fill();
    ink(ctx, 2.5); ctx.stroke();
  })();
  // tower emplacements (wood + iron material contrast)
  function cannonTower(ctx, x, y, s, ang) {
    drop(ctx, x+6*s, y+13*s, 22*s, 8*s, .34);
    // stone base
    shadeBall(ctx, x, y+2*s, 20*s, '#5e5648', '#8c8272'); ctx.beginPath(); ctx.arc(x, y+2*s, 19*s, 0, 7); ctx.fill();
    ink(ctx, 3*s); ctx.stroke();
    // timber deck
    ctx.fillStyle = '#8a5f34'; ctx.beginPath(); ctx.arc(x, y-1*s, 14*s, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(60,38,18,.55)'; ctx.lineWidth = 1.6*s;
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(x-13*s, y-1*s+i*5*s); ctx.lineTo(x+13*s, y-1*s+i*5*s); ctx.stroke(); }
    ink(ctx, 2.6*s); ctx.beginPath(); ctx.arc(x, y-1*s, 14*s, 0, 7); ctx.stroke();
    // iron barrel
    ctx.save(); ctx.translate(x, y-2*s); ctx.rotate(ang);
    const bg2 = ctx.createLinearGradient(0,-5*s,0,5*s); bg2.addColorStop(0,'#6e7683'); bg2.addColorStop(.45,'#454c58'); bg2.addColorStop(1,'#2b3039');
    ctx.fillStyle = bg2; ctx.beginPath(); ctx.roundRect(-4*s,-5*s, 26*s, 10*s, 3*s); ctx.fill();
    ctx.fillStyle = '#1d2129'; ctx.beginPath(); ctx.ellipse(22*s,0,2.4*s,5*s,0,0,7); ctx.fill();
    ctx.fillStyle = '#8b93a1'; ctx.fillRect(2*s,-5*s,3*s,2*s);
    ink(ctx, 2.4*s); ctx.beginPath(); ctx.roundRect(-4*s,-5*s, 26*s, 10*s, 3*s); ctx.stroke();
    ctx.restore();
    // hub + rivets
    shadeBall(ctx, x, y-2*s, 7*s, '#3c424c', '#79808c'); ctx.beginPath(); ctx.arc(x, y-2*s, 6.5*s, 0, 7); ctx.fill();
    ink(ctx, 2.2*s); ctx.stroke();
    ctx.fillStyle = '#b9c0cb';
    for (let i = 0; i < 6; i++) { const a = i/6*6.28; ctx.beginPath(); ctx.arc(x+Math.cos(a)*11*s, y-1*s+Math.sin(a)*11*s, 1.5*s, 0, 7); ctx.fill(); }
    // sandbags
    for (let i = 0; i < 4; i++) { const a = 2.2+i*.45; ctx.fillStyle = i%2?'#b8a06e':'#a68f60';
      ctx.beginPath(); ctx.ellipse(x+Math.cos(a)*20*s, y+2*s+Math.sin(a)*17*s, 6*s, 4*s, a, 0, 7); ctx.fill(); ink(ctx,1.8*s); ctx.stroke(); }
  }
  cannonTower(ctx, 300, 120, 1, .55); cannonTower(ctx, 640, 210, 1, .7); cannonTower(ctx, 900, 300, 1, .85);
  // enemy column: chunky characterful cars with outlines
  function toonCar(ctx, x, y, a, s, body, roof) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    drop(ctx, 2*s, 4*s, 15*s, 8*s, .3);
    ctx.fillStyle = '#20180f';
    ctx.beginPath(); ctx.roundRect(-9*s,-8*s, 7*s, 4*s, 1.5*s); ctx.fill();
    ctx.beginPath(); ctx.roundRect(-9*s, 4*s, 7*s, 4*s, 1.5*s); ctx.fill();
    ctx.beginPath(); ctx.roundRect(5*s,-8*s, 7*s, 4*s, 1.5*s); ctx.fill();
    ctx.beginPath(); ctx.roundRect(5*s, 4*s, 7*s, 4*s, 1.5*s); ctx.fill();
    const bg3 = ctx.createLinearGradient(0,-7*s,0,7*s); bg3.addColorStop(0, roof); bg3.addColorStop(1, body);
    ctx.fillStyle = bg3; ctx.beginPath(); ctx.roundRect(-14*s,-7*s, 30*s, 14*s, 4*s); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.30)'; ctx.beginPath(); ctx.roundRect(-11*s,-6*s, 22*s, 4*s, 2*s); ctx.fill();
    ctx.fillStyle = '#2a3540'; ctx.beginPath(); ctx.roundRect(1*s,-5*s, 8*s, 10*s, 2*s); ctx.fill();
    ctx.fillStyle = '#f4e39a'; ctx.beginPath(); ctx.arc(14*s,-4*s, 2.2*s, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(14*s, 4*s, 2.2*s, 0, 7); ctx.fill();
    ink(ctx, 3*s); ctx.beginPath(); ctx.roundRect(-14*s,-7*s, 30*s, 14*s, 4*s); ctx.stroke();
    ctx.restore();
  }
  const cols = [['#b8402f','#d4614a'],['#3f7a9e','#5c9dc2'],['#c98a2c','#e0a94a'],['#7a5a9e','#9878bd'],['#4f8a45','#6dab5e']];
  [[60,132,.14],[150,142,.2],[250,168,.3],[345,203,.25],[440,228,.2],[530,248,.22],[620,272,.35],[700,296,.4],[790,336,.45],[870,378,.5],[955,428,.35]]
    .forEach(([x,y,a],i) => toonCar(ctx, x, y, a, 1.35, cols[i%5][0], cols[i%5][1]));
  // muzzle flash + smoke storytelling
  ctx.globalCompositeOperation = 'lighter';
  const fg = ctx.createRadialGradient(690,246,3,690,246,52); fg.addColorStop(0,'rgba(255,246,214,.95)'); fg.addColorStop(1,'rgba(240,150,40,0)');
  ctx.fillStyle = fg; ctx.fillRect(638,194,104,104);
  ctx.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 9; i++) { ctx.fillStyle = `rgba(70,60,50,${.16-i*.014})`;
    ctx.beginPath(); ctx.arc(700+i*13, 240-i*9, 9+i*3.4, 0, 7); ctx.fill(); }
  assetBar(ctx, 560, '#efe4cf', '#c9b795');
  label(ctx, 24, 586, 'ASSETS — thick ink outline · warm key light · timber/stone/iron material contrast', '#7c6b4e', 12);
  cannonTower(ctx, 130, 680, 1.85, -.5);
  (() => { // ballista-style variant
    const x=330,y=680,s=1.85; drop(ctx,x+8*s,y+13*s,22*s,8*s,.3);
    shadeBall(ctx,x,y+2*s,20*s,'#5e5648','#8c8272'); ctx.beginPath(); ctx.arc(x,y+2*s,19*s,0,7); ctx.fill(); ink(ctx,3*s); ctx.stroke();
    ctx.fillStyle='#8a5f34'; ctx.beginPath(); ctx.arc(x,y-1*s,14*s,0,7); ctx.fill(); ink(ctx,2.6*s); ctx.stroke();
    ctx.save(); ctx.translate(x,y-3*s); ctx.rotate(-.35);
    ctx.strokeStyle='#5b3f22'; ctx.lineWidth=4*s; ctx.beginPath(); ctx.arc(6*s,0,13*s,-1.1,1.1); ctx.stroke();
    ctx.strokeStyle='#e8e0cc'; ctx.lineWidth=1.4*s; ctx.beginPath(); ctx.moveTo(6*s+13*s*Math.cos(-1.1),13*s*Math.sin(-1.1)); ctx.lineTo(6*s+13*s*Math.cos(1.1),13*s*Math.sin(1.1)); ctx.stroke();
    ctx.fillStyle='#6b7280'; ctx.beginPath(); ctx.moveTo(24*s,0); ctx.lineTo(10*s,-3*s); ctx.lineTo(10*s,3*s); ctx.closePath(); ctx.fill(); ink(ctx,2*s); ctx.stroke();
    ctx.restore();
  })();
  toonCar(ctx, 560, 668, -.1, 2.1, '#b8402f', '#d4614a');
  toonCar(ctx, 760, 668, -.1, 2.1, '#3f7a9e', '#5c9dc2');
  tree(ctx, 930, 676, 46, '#2c4a1c', '#3f6b26', '#5b8f33');
  rock(ctx, 1080, 682, 34, [{c:'#6b6558',p:[[-1,.3],[-.6,-.7],[.5,-.9],[1,.1],[.4,.7],[-.5,.75]]},
                            {c:'#8e8878',p:[[-.6,-.7],[.5,-.9],[.2,-.1],[-.5,.05]]},
                            {c:'#57513f',p:[[-.5,.05],[.2,-.1],[1,.1],[.4,.7],[-.5,.75]]}]);
})();

// ============ B · GRIT & STEEL ============
(() => {
  const ctx = document.getElementById('b').getContext('2d');
  ctx.fillStyle = '#3b3a36'; ctx.fillRect(0,0,1200,560);
  // cracked hardpan with tonal patches
  for (let i = 0; i < 34; i++) { ctx.fillStyle = ['rgba(90,86,74,.22)','rgba(28,28,26,.3)','rgba(120,112,92,.14)'][i%3];
    ctx.beginPath(); ctx.ellipse(Math.random()*1200, Math.random()*550, 70+Math.random()*150, 30+Math.random()*60, Math.random()*3,0,7); ctx.fill(); }
  grain(ctx, 0, 0, 1200, 560, 5200, 'rgba(0,0,0,.16)', 'rgba(200,190,165,.09)');
  // asphalt corridor with painted edge lines + hazard chevrons
  ctx.fillStyle = '#26262a'; ctx.beginPath();
  ctx.moveTo(0,150); ctx.lineTo(1200,60); ctx.lineTo(1200,300); ctx.lineTo(0,400); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.beginPath();
  ctx.moveTo(0,158); ctx.lineTo(1200,68); ctx.lineTo(1200,96); ctx.lineTo(0,186); ctx.closePath(); ctx.fill();
  grain(ctx, 0, 60, 1200, 340, 4200, 'rgba(0,0,0,.3)', 'rgba(190,190,190,.06)');
  ctx.strokeStyle = 'rgba(226,206,120,.75)'; ctx.lineWidth = 4; ctx.setLineDash([34,26]);
  ctx.beginPath(); ctx.moveTo(0,272); ctx.lineTo(1200,180); ctx.stroke(); ctx.setLineDash([]);
  // oil stains + tyre scrub
  for (let i = 0; i < 26; i++) { const x=Math.random()*1200, y=100+Math.random()*250;
    ctx.fillStyle = 'rgba(10,10,14,.4)'; ctx.beginPath(); ctx.ellipse(x,y,10+Math.random()*30,5+Math.random()*13,Math.random()*3,0,7); ctx.fill(); }
  for (let i = 0; i < 60; i++) { const x=Math.random()*1200, y=90+Math.random()*260;
    ctx.fillStyle='rgba(16,16,18,.3)'; ctx.fillRect(x,y,26+Math.random()*60,3); }
  // concrete jersey barriers along the road
  function barrier(ctx, x, y, s, ang) {
    ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
    drop(ctx, 3*s, 9*s, 30*s, 8*s, .4);
    const gg = ctx.createLinearGradient(0,-14*s,0,12*s); gg.addColorStop(0,'#b9b2a2'); gg.addColorStop(.5,'#8d8778'); gg.addColorStop(1,'#605b50');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.moveTo(-28*s,10*s); ctx.lineTo(-20*s,-12*s); ctx.lineTo(20*s,-12*s); ctx.lineTo(28*s,10*s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(-20*s,-12*s,40*s,3*s);
    for (let i = 0; i < 4; i++) { ctx.fillStyle = i%2 ? '#c8452f' : '#e8e2d2';
      ctx.save(); ctx.beginPath(); ctx.rect(-26*s,-2*s,52*s,8*s); ctx.clip();
      ctx.beginPath(); ctx.moveTo(-26*s+i*14*s,6*s); ctx.lineTo(-18*s+i*14*s,-2*s); ctx.lineTo(-11*s+i*14*s,-2*s); ctx.lineTo(-19*s+i*14*s,6*s); ctx.closePath(); ctx.fill(); ctx.restore(); }
    grain(ctx, -28*s, -12*s, 56*s, 22*s, 90, 'rgba(0,0,0,.2)', 'rgba(255,255,255,.1)');
    ctx.restore();
  }
  [[130,392,1,-.075],[290,380,1,-.075],[450,368,1,-.075],[900,120,1,-.075],[1060,108,1,-.075]].forEach(b=>barrier(ctx,...b));
  // bunker emplacements: cast concrete + emissive tech
  function bunker(ctx, x, y, s, ang, accent) {
    drop(ctx, x+7*s, y+16*s, 30*s, 11*s, .45);
    const gg = ctx.createLinearGradient(x-26*s, y-26*s, x+22*s, y+22*s);
    gg.addColorStop(0,'#9c968a'); gg.addColorStop(.55,'#6d685e'); gg.addColorStop(1,'#474339');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.moveTo(x-26*s,y-8*s); ctx.lineTo(x-16*s,y-24*s); ctx.lineTo(x+16*s,y-24*s);
    ctx.lineTo(x+26*s,y-8*s); ctx.lineTo(x+20*s,y+14*s); ctx.lineTo(x-20*s,y+14*s); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(20,18,14,.6)'; ctx.lineWidth = 2.4*s; ctx.stroke();
    ctx.fillStyle = 'rgba(255,252,240,.14)';
    ctx.beginPath(); ctx.moveTo(x-16*s,y-24*s); ctx.lineTo(x+16*s,y-24*s); ctx.lineTo(x+12*s,y-16*s); ctx.lineTo(x-12*s,y-16*s); ctx.closePath(); ctx.fill();
    grain(ctx, x-26*s, y-24*s, 52*s, 38*s, 140, 'rgba(0,0,0,.22)', 'rgba(255,255,255,.1)');
    // rebar + wear
    ctx.strokeStyle='rgba(120,70,40,.5)'; ctx.lineWidth=1.4*s;
    ctx.beginPath(); ctx.moveTo(x-22*s,y+8*s); ctx.lineTo(x-14*s,y+12*s); ctx.stroke();
    // turret
    ctx.save(); ctx.translate(x, y-6*s); ctx.rotate(ang);
    ctx.fillStyle = '#3a3f47'; ctx.beginPath(); ctx.roundRect(-10*s,-8*s,20*s,16*s,3*s); ctx.fill();
    const bg4 = ctx.createLinearGradient(0,-4*s,0,4*s); bg4.addColorStop(0,'#79808c'); bg4.addColorStop(1,'#33383f');
    ctx.fillStyle = bg4; ctx.fillRect(6*s,-3.5*s,26*s,7*s);
    ctx.fillStyle = '#1b1e24'; ctx.fillRect(30*s,-4.5*s,4*s,9*s);
    ctx.fillStyle = accent; ctx.fillRect(-6*s,-6*s,4*s,12*s);
    ctx.shadowColor = accent; ctx.shadowBlur = 14*s; ctx.fillRect(-6*s,-6*s,4*s,12*s); ctx.shadowBlur = 0;
    ctx.restore();
    ctx.fillStyle = accent; ctx.font = `700 ${7*s}px Bahnschrift`; ctx.fillText('AC-01', x-13*s, y+10*s);
  }
  bunker(ctx, 250, 470, 1, -.35, '#f2b33d'); bunker(ctx, 640, 455, 1, -.3, '#f2b33d'); bunker(ctx, 1010, 430, 1, -.4, '#5ee0c8');
  // smooth glossy enemy vehicles (material contrast vs matte concrete)
  function slickCar(ctx, x, y, a, s, c1, c2) {
    ctx.save(); ctx.translate(x,y); ctx.rotate(a);
